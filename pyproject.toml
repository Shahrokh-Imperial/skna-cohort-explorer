[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="skna-cohort-explorer"
version="1.0.0"
description="Interactive exploration of processed ECG-derived SKNA cohorts"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["streamlit==1.61.0","starlette==0.52.1","plotly>=5.20","pandas>=2.0","numpy>=1.24","scipy>=1.10","pyarrow>=14"]

[tool.setuptools.packages.find]
where=["src"]
